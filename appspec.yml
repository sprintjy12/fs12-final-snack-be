version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/snack/backend

file_exists_behavior: OVERWRITE

permissions:
  - object: /home/ec2-user/snack/backend
    pattern: "**"
    owner: ec2-user
    group: ec2-user
    type:
      - file
      - directory

hooks:
  ApplicationStart:
    - location: scripts/codedeploy-backend.sh
      timeout: 900
      runas: ec2-user